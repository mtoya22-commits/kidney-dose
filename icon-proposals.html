<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>App Icon Proposals — 腎機能別投与量</title>
<style>
  body { background:#1a1a2e; font-family: system-ui, sans-serif; color:#fff; padding:40px; }
  h1 { font-size:18px; margin-bottom:8px; color:#aaa; }
  .grid { display:flex; gap:40px; flex-wrap:wrap; }
  .card { text-align:center; }
  .card p { margin:12px 0 4px; font-size:14px; font-weight:600; }
  .card small { font-size:11px; color:#888; }
  svg { border-radius:22.5%; display:block; box-shadow:0 8px 32px rgba(0,0,0,.6); }
</style>
</head>
<body>
<h1>iPhone App Icon Proposals — 腎機能別投与量チェッカー</h1>
<div class="grid">

<!-- A: Teal Kidney + Pill -->
<div class="card">
<svg width="180" height="180" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0a3d4a"/>
    </linearGradient>
    <linearGradient id="kidneyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgA)"/>
  <!-- Kidney shape (left) -->
  <path d="M 155 130
    C 90 130, 55 185, 55 256
    C 55 327, 90 382, 155 382
    C 185 382, 200 365, 210 345
    C 220 325, 215 290, 215 256
    C 215 222, 220 187, 210 167
    C 200 147, 185 130, 155 130 Z"
    fill="url(#kidneyA)" opacity="0.95"/>
  <!-- Hilum indent -->
  <path d="M 210 220 C 230 235, 230 277, 210 292"
    fill="none" stroke="#0a3d4a" stroke-width="18" stroke-linecap="round"/>
  <!-- Kidney shape (right, mirrored) -->
  <path d="M 357 130
    C 422 130, 457 185, 457 256
    C 457 327, 422 382, 357 382
    C 327 382, 312 365, 302 345
    C 292 325, 297 290, 297 256
    C 297 222, 292 187, 302 167
    C 312 147, 327 130, 357 130 Z"
    fill="url(#kidneyA)" opacity="0.95"/>
  <path d="M 302 220 C 282 235, 282 277, 302 292"
    fill="none" stroke="#0a3d4a" stroke-width="18" stroke-linecap="round"/>
  <!-- Pill capsule in center -->
  <rect x="218" y="232" width="76" height="48" rx="24" fill="#fff" opacity="0.15"/>
  <rect x="218" y="232" width="38" height="48" rx="24" fill="#f0abfc" opacity="0.7"/>
  <rect x="256" y="232" width="38" height="48" rx="0 24 24 0" fill="#e879f9" opacity="0.7"/>
  <line x1="256" y1="234" x2="256" y2="278" stroke="#fff" stroke-width="2" opacity="0.4"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="0.5" opacity="0.05"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="0.5" opacity="0.05"/>
  <!-- Bottom label area -->
  <rect x="0" y="420" width="512" height="92" fill="#000" opacity="0.25"/>
  <text x="256" y="468" text-anchor="middle" font-family="system-ui" font-size="34" font-weight="700" fill="#2dd4bf">腎機能</text>
  <text x="256" y="500" text-anchor="middle" font-family="system-ui" font-size="22" fill="#7dd3fc" opacity="0.8">投与量</text>
</svg>
<p>A: Teal Kidney</p>
<small>深夜の手術室イメージ<br>ティール×ダークネイビー</small>
</div>

<!-- B: White Medical -->
<div class="card">
<svg width="180" height="180" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7f8"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="kidneyB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e6b78"/>
      <stop offset="100%" stop-color="#0e4f6f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgB)"/>
  <!-- Left kidney -->
  <path d="M 148 115
    C 78 115, 42 175, 42 256
    C 42 337, 78 397, 148 397
    C 180 397, 197 379, 208 357
    C 219 335, 214 297, 214 256
    C 214 215, 219 177, 208 155
    C 197 133, 180 115, 148 115 Z"
    fill="url(#kidneyB)"/>
  <path d="M 208 215 C 232 232, 232 280, 208 297"
    fill="none" stroke="#f0f7f8" stroke-width="20" stroke-linecap="round"/>
  <!-- Right kidney -->
  <path d="M 364 115
    C 434 115, 470 175, 470 256
    C 470 337, 434 397, 364 397
    C 332 397, 315 379, 304 357
    C 293 335, 298 297, 298 256
    C 298 215, 293 177, 304 155
    C 315 133, 332 115, 364 115 Z"
    fill="url(#kidneyB)"/>
  <path d="M 304 215 C 280 232, 280 280, 304 297"
    fill="none" stroke="#f0f7f8" stroke-width="20" stroke-linecap="round"/>
  <!-- Rx symbol center -->
  <circle cx="256" cy="256" r="52" fill="#fff" opacity="0.9"/>
  <text x="256" y="274" text-anchor="middle" font-family="serif" font-size="64" font-weight="900" fill="#1e6b78">Rx</text>
</svg>
<p>B: White Clinical</p>
<small>清潔感・信頼感<br>ホワイト×ティール</small>
</div>

<!-- C: Dark Gradient Gem -->
<div class="card">
<svg width="180" height="180" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgC" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#050312"/>
    </radialGradient>
    <linearGradient id="kidneyC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bgC)"/>
  <!-- Glow circles -->
  <circle cx="180" cy="256" r="120" fill="#7c3aed" opacity="0.12"/>
  <circle cx="332" cy="256" r="120" fill="#0369a1" opacity="0.12"/>
  <!-- Left kidney with glow -->
  <path d="M 142 118
    C 74 118, 38 178, 38 256
    C 38 334, 74 394, 142 394
    C 175 394, 193 375, 205 352
    C 217 329, 212 293, 212 256
    C 212 219, 217 183, 205 160
    C 193 137, 175 118, 142 118 Z"
    fill="url(#kidneyC)" filter="url(#glow)" opacity="0.9"/>
  <path d="M 205 212 C 230 230, 230 282, 205 300"
    fill="none" stroke="#050312" stroke-width="22" stroke-linecap="round"/>
  <!-- Right kidney -->
  <path d="M 370 118
    C 438 118, 474 178, 474 256
    C 474 334, 438 394, 370 394
    C 337 394, 319 375, 307 352
    C 295 329, 300 293, 300 256
    C 300 219, 295 183, 307 160
    C 319 137, 337 118, 370 118 Z"
    fill="url(#kidneyC)" filter="url(#glow)" opacity="0.9"/>
  <path d="M 307 212 C 282 230, 282 282, 307 300"
    fill="none" stroke="#050312" stroke-width="22" stroke-linecap="round"/>
  <!-- Center star/cross accent -->
  <circle cx="256" cy="256" r="28" fill="#fff" opacity="0.08"/>
  <line x1="256" y1="228" x2="256" y2="284" stroke="#e0e7ff" stroke-width="4" opacity="0.5"/>
  <line x1="228" y1="256" x2="284" y2="256" stroke="#e0e7ff" stroke-width="4" opacity="0.5"/>
</svg>
<p>C: Midnight Gem</p>
<small>プレミアム・高級感<br>パープル×インディゴ</small>
</div>

<!-- D: Warm Medical -->
<div class="card">
<svg width="180" height="180" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#2d1200"/>
    </linearGradient>
    <linearGradient id="kidneyD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="pillD" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgD)"/>
  <!-- Warm glow -->
  <circle cx="256" cy="256" r="200" fill="#dc2626" opacity="0.08"/>
  <!-- Left kidney -->
  <path d="M 148 125
    C 80 125, 44 182, 44 256
    C 44 330, 80 387, 148 387
    C 180 387, 197 369, 208 347
    C 219 325, 214 290, 214 256
    C 214 222, 219 187, 208 165
    C 197 143, 180 125, 148 125 Z"
    fill="url(#kidneyD)"/>
  <path d="M 208 218 C 233 235, 233 277, 208 294"
    fill="none" stroke="#1a0a00" stroke-width="20" stroke-linecap="round"/>
  <!-- Right kidney -->
  <path d="M 364 125
    C 432 125, 468 182, 468 256
    C 468 330, 432 387, 364 387
    C 332 387, 315 369, 304 347
    C 293 325, 298 290, 298 256
    C 298 222, 293 187, 304 165
    C 315 143, 332 125, 364 125 Z"
    fill="url(#kidneyD)"/>
  <path d="M 304 218 C 279 235, 279 277, 304 294"
    fill="none" stroke="#1a0a00" stroke-width="20" stroke-linecap="round"/>
  <!-- Capsule pill center -->
  <rect x="214" y="230" width="84" height="52" rx="26" fill="#000" opacity="0.3"/>
  <rect x="216" y="232" width="80" height="48" rx="24" fill="url(#pillD)" opacity="0.9"/>
  <rect x="216" y="232" width="40" height="48" rx="24 0 0 24" fill="#fbbf24"/>
  <line x1="256" y1="234" x2="256" y2="278" stroke="#1a0a00" stroke-width="2.5" opacity="0.5"/>
  <!-- Small cross symbol top right -->
  <circle cx="390" cy="122" r="36" fill="#dc2626"/>
  <rect x="378" y="110" width="24" height="8" rx="4" fill="#fff"/>
  <rect x="383" y="105" width="8" height="24" fill="none"/>
  <line x1="390" y1="108" x2="390" y2="136" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="376" y1="122" x2="404" y2="122" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
<p>D: Warm Red</p>
<small>緊急性・医療の力強さ<br>レッド×オレンジ×アンバー</small>
</div>

</div>

<p style="margin-top:40px;color:#555;font-size:12px">
  ※ iOSはアイコンに角丸を自動適用します。<br>
  このプレビューの角丸はiOS適用後のイメージです。
</p>
</body>
</html>
